</style></head><body><div class="w">
<h1>パーク1日プランナー</h1>
<p class="s" id="src">予測モデル：端末の実績を使用</p>
<div id="form"></div>
<div class="c"><h2>提案プラン</h2><div class="sum" id="sum"></div><div id="out"></div><button class="bt" data-a="copy">プランをコピー</button></div>
<p class="s">待ち時間は「パーク待ち時間予測」と同じ予測モデル（曜日・天気・時期・実績からの学習）で計算し、固定枠（ショー・食事・買い物・DPA）を除いた空き時間に、待ち時間の合計が最小になる順番を探します。ショーやパレードの時刻は公式アプリで確認してください。待ち時間データ：<a href="https://queue-times.com/" target="_blank" rel="noopener">Powered by Queue-Times.com</a>／天気：Open-Meteo</p>
</div>
<script>
(()=>{'use strict';
const rides={
 land:[['美女と野獣「魔法のものがたり」',110,1.18],['ベイマックスのハッピーライド',90,1.22],['プーさんのハニーハント',65,1.08],['モンスターズ・インク',60,1.04],['スプラッシュ・マウンテン',70,1.06],['ビッグサンダー・マウンテン',55,1],['スペース・マウンテン相当',65,1.05],['ホーンテッドマンション',40,.92],['バズ・ライトイヤー相当',50,.98],['カリブの海賊',20,.82]],
 sea:[['アナとエルサのフローズンジャーニー',125,1.2],['ラプンツェルのランタンフェスティバル',100,1.16],['ピーターパンのネバーランドアドベンチャー',95,1.14],['ソアリン：ファンタスティック・フライト',120,1.18],['トイ・ストーリー・マニア！',105,1.15],['タワー・オブ・テラー',65,1.02],['センター・オブ・ジ・アース',65,1.03],['インディ・ジョーンズ',50,.98],['レイジングスピリッツ',45,.96],['ニモ＆フレンズ・シーライダー',35,.9]]
};
Object.values(rides).forEach(a=>a.forEach((r,i)=>{r[3]=i;r[4]=i}));const mi=(p,i)=>rides[p][i][4],K=(p,i)=>p+'|'+rides[p][i][3];
const storeKey='parkWaitActualsV2',RD=8,WK=10;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?+m[1]*60+ +m[2]:NaN},fm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const ymd=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const round5=n=>Math.max(5,Math.round(n/5)*5);
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(storeKey)||'[]');return Array.isArray(v)?v.filter(x=>x&&typeof x==='object'):[]}catch(e){return[]}}
let SHARED=[],HC=null,SHOWS=null,TBL=null,TK='',PLAN=[],sd=1;
function loadHistory(){return HC||loadLocal().concat(SHARED)}
function inferCtx(d){const m=d.getMonth()+1,n=d.getDate(),v=(m===4&&n>=29)||(m===5&&n<=5)||(m===8&&n>=8&&n<=16)||(m===12&&n>=26)||(m===1&&n<=4);return{season:v?'busy':'normal',dayType:v?'vacation':'auto'}}
function dayFactor(date){const d=date.getDay();return d===6?1.22:d===0?1.17:d===5?1.07:1}
function baseCurve(min,idx,openMinute,closeMinute){
 // 09:00開園時は従来モデルの曲線を維持し、開園時刻に応じて全体をシフトする。
 const h=9+(min-openMinute)/60, closeHour=9+(closeMinute-openMinute)/60;
 const morning=Math.exp(-Math.pow((h-(9.55+(idx%3)*.18))/1.05,2));
 const noon=Math.exp(-Math.pow((h-(12.4+(idx%2)*.35))/2.0,2));
 const evening=Math.exp(-Math.pow((h-(16.3+(idx%4)*.22))/1.65,2));
 const closeDrop=1-Math.max(0,h-(closeHour-3))*.13;
 const popular=idx<=4;
 const trend=(popular?.56+.58*morning+.22*noon+.16*evening:.48+.27*morning+.38*noon+.25*evening)*Math.max(.55,closeDrop);
 const phase=idx*1.37;
 const wave1=Math.sin((h-9)*Math.PI/1.05+phase)*.055;
 const wave2=Math.sin((h-9)*Math.PI/.46+phase*.63)*.027;
 return Math.max(.42,trend*(1+wave1+wave2));
}
function circularDayDistance(a,b){const d=Math.abs(a-b);return Math.min(d,7-d)}
function seasonDistance(a,b){const rank={quiet:0,normal:1,busy:2,verybusy:3};return Math.abs((rank[a]??1)-(rank[b]??1))}
function weatherWeight(a,b){if(!a||!b)return .78;if(a===b)return 1;return (a==='heavy'||b==='heavy')?.42:.68}
function dayTypeWeight(a,b){a=a||'auto';b=b||'auto';if(a===b)return 1;if(a==='auto'||b==='auto')return .72;return .48}
function contextWeight(x,ctx,date){
 const oldDate=new Date((x.date||'')+'T12:00:00');if(Number.isNaN(oldDate.getTime()))return 0;
 const dayDist=circularDayDistance(oldDate.getDay(),date.getDay());
 const weekday=Math.pow(.78,dayDist);
 const weather=weatherWeight(x.weather,ctx.weather);
 const season=Math.pow(.72,seasonDistance(x.season,ctx.season));
 const dayType=dayTypeWeight(x.dayType,ctx.dayType);
 const oldOpen=Number.isFinite(x.openMinute)?x.openMinute:540;
 const oldClose=Number.isFinite(x.closeMinute)?x.closeMinute:1260;
 const schedule=Math.exp(-Math.abs(oldOpen-ctx.openMinute)/150)*Math.exp(-Math.abs(oldClose-ctx.closeMinute)/240);
 const ageDays=Math.max(0,(Date.now()-(Number(x.at)||Date.now()))/86400000);
 const recency=Math.exp(-Math.LN2*ageDays/240);
 // 旧方式で保存した履歴も残すが、新方式の記録より少し弱く扱う。
 const version=(x.modelVersion===3)?1:.72;
 return weekday*weather*season*dayType*schedule*recency*version*(x.date===ctx.dateValue?3:1);
}
function weightedRobustLog(items){
 if(!items.length)return {mean:0,weight:0};
 const sorted=[...items].sort((a,b)=>a.log-b.log);let total=sorted.reduce((s,x)=>s+x.w,0),acc=0,median=sorted[0].log;
 for(const x of sorted){acc+=x.w;if(acc>=total/2){median=x.log;break}}
 // 中央値から大きく外れた単発値を抑えて、加重平均を計算する。
 const cap=.38;let sw=0,s=0;
 for(const x of items){const v=Math.max(median-cap,Math.min(median+cap,x.log));sw+=x.w;s+=x.w*v}
 return {mean:sw?s/sw:0,weight:sw};
}
function learnedRatio(key,minute,date,ctx){
 const hist=loadHistory().filter(x=>x.key===key&&Number.isFinite(Number(x.ratio))&&Number(x.ratio)>0);
 if(!hist.length)return {value:1,confidence:0,support:0};
 const globalItems=[],localItems=[];let support=0;
 for(const x of hist){
  const cw=contextWeight(x,ctx,date);if(cw<.015)continue;
  const ratio=Math.max(.5,Math.min(1.9,Number(x.ratio)));
  const item={log:Math.log(ratio),w:cw};globalItems.push(item);
  const timeDist=Math.abs(Number(x.minute)-minute);
  const localKernel=Math.exp(-.5*Math.pow(timeDist/75,2));
  const lw=cw*localKernel;
  if(lw>.015)localItems.push({log:item.log,w:lw});
  if(cw>.12)support++;
 }
 const global=weightedRobustLog(globalItems),local=weightedRobustLog(localItems);
 if(global.weight<.04)return {value:1,confidence:0,support};
 const localShare=local.weight/(local.weight+.45);
 const estimate=global.mean*(1-localShare)+local.mean*localShare;
 const evidence=.42*global.weight+.58*local.weight;
 const confidence=1-Math.exp(-evidence/1.65);
 const value=Math.exp(estimate*confidence);
 return {value:Math.max(.62,Math.min(1.55,value)),confidence,support};
}

const def=()=>({park:'land',open:'09:00',close:'21:00',season:'normal',dayType:'auto',weather:'sun',date:ymd(new Date()),sel:{'land|0':1,'land|1':1,'land|2':1,'land|4':1,'sea|0':1,'sea|1':1,'sea|3':1,'sea|4':1},must:{},dpa:{},
ev:[{t:'パレード',n:'昼のパレード',s:'14:00',d:40,on:true},{t:'ショー',n:'夜のショー',s:'19:30',d:40,on:false}],
meals:[{n:'昼食',s:'11:30',d:60,on:true},{n:'夕食',s:'17:30',d:60,on:true},{n:'おやつ休憩',s:'15:30',d:20,on:false}],shop:{s:'19:45',d:45,on:true}});
let S=def();
try{Object.assign(S,JSON.parse(localStorage.getItem('parkPlanV2')||'{}'))}catch(e){}
{const ic=inferCtx(new Date());S.date=ymd(new Date());S.season=ic.season;S.dayType=ic.dayType;S.weather='sun'}
const save=()=>{try{localStorage.setItem('parkPlanV2',JSON.stringify(S))}catch(e){}};
async function loadShared(after){
 try{
  const J=async u=>{const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw 0;return r.json()};
  const [rl,hj]=await Promise.all([J('data/rides.json').catch(()=>null),J('data/history.json')]);
  const by={},E={};
  for(const [p,id,d,s,w] of hj.rows){if(id<100)continue;(by[p+'|'+id]||(by[p+'|'+id]=[])).push(w)}
  if(rl)for(const pk of ['land','sea']){const list=rl[pk]||[];if(!list.length)continue;const old=rides[pk].slice(0,10);rides[pk].length=0;
   list.forEach(([id,name,bi])=>{const a=by[(pk==='sea'?1:0)+'|'+id]||[],o=bi!=null?old[bi]:null;let idx=bi!=null?bi:5+id%5,base=o?o[1]:40,f=o?o[2]:1;
    if(a.length>=8){const avg=a.reduce((x,y)=>x+y,0)/a.length;if(bi==null)idx=(avg>=40?0:5)+id%5;let cm=0,n=0;for(let m=540;m<=1260;m+=30){cm+=baseCurve(m,idx,540,1260);n++}base=Math.max(5,avg/(cm/n)/1.1);f=1}
    rides[pk].push([o?o[0]:name,base,f,id,idx])})}
  for(const pk of ['land','sea'])rides[pk].forEach(r=>E[(pk==='sea'?1:0)+'|'+r[3]]=r);
  const local=new Set(loadLocal().map(x=>x.key+'|'+x.date+'|'+x.minute)),cache={},out=[];
  for(const [p,id,date,slot,wait,wc] of hj.rows){const e=E[p+'|'+id];if(!e)continue;const pk=p?'sea':'land',key=pk+'|'+id;if(local.has(key+'|'+date+'|'+slot))continue;
   const d=new Date(date+'T12:00:00'),ic=cache[date]||(cache[date]=inferCtx(d)),sf={quiet:.78,normal:1,busy:1.24}[ic.season],df=ic.dayType==='vacation'?1.22:1,raw=e[1]*baseCurve(slot,e[4],540,1260)*dayFactor(d)*sf*df*[1,.94,.86][wc]*e[2];
   out.push({key,date,minute:slot,actual:wait,ratio:Math.max(.45,Math.min(1.9,wait/Math.max(5,raw))),weather:['sun','rain','heavy'][wc],season:ic.season,dayType:ic.dayType,openMinute:540,closeMinute:1260,modelVersion:3,src:'shared',at:d.getTime()})}
  SHARED=out;after(out.length)
 }catch(e){}
}
fetch('data/shows.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{SHOWS=j;form()}).catch(()=>{});
async function weatherOf(ds){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.633&longitude=139.880&daily=precipitation_sum&timezone=Asia%2FTokyo&past_days=3&forecast_days=16'),j=await r.json(),i=j.daily.time.indexOf(ds);if(i<0)return null;const p=j.daily.precipitation_sum[i];return p>=15?'heavy':p>=3?'rain':'sun'}catch(e){return null}}
const autoW=()=>weatherOf(S.date).then(w=>{if(w){S.weather=w;TBL=null;form();plan()}});
const todayShows=()=>((SHOWS&&SHOWS[S.park])||[]).filter(x=>x.d===S.date);
function impShows(){S.ev=todayShows().slice(0,30).map(x=>({t:/parade|パレード/i.test(x.n)?'パレード':'ショー',n:x.n,s:x.s,d:x.m||40,on:false}))}
function sBtn(){const a=todayShows();return a.length?`<div class="r"><button class="bt" data-a="imp">この日の公式予定を取り込む（${a.length}件）</button></div><div class="s">取り込み後、見るものにチェックを入れてください</div>`:`<div class="s">この日のショー予定の自動取得データはありません（手入力してください）</div>`}
function table(){const P=S.park,o=tm(S.open),c=tm(S.close),k=[P,S.date,S.weather,S.season,S.dayType,S.open,S.close,SHARED.length,rides[P].length,Object.keys(S.sel).filter(x=>S.sel[x]).join()].join('~');if(TBL&&TK===k)return TBL;
 const date=new Date(S.date+'T12:00:00'),ctx={season:S.season,weather:S.weather,dayType:S.dayType,openMinute:o,closeMinute:c,dateValue:S.date},
 f=({quiet:.78,normal:1,busy:1.24,verybusy:1.48}[S.season])*({auto:1,holiday:1.12,vacation:1.22,event:1.16}[S.dayType])*({sun:1,rain:.94,heavy:.86}[S.weather])*dayFactor(date);
 HC=loadLocal().concat(SHARED);const T={};
 rides[P].forEach((r,i)=>{if(!S.sel[K(P,i)])return;T[i]=[];for(let m=o;m<=c;m+=15)T[i].push(round5(r[1]*baseCurve(m,mi(P,i),o,c)*f*r[2]*learnedRatio(K(P,i),m,date,ctx).value))});
 HC=null;TBL=T;TK=k;return T}
const wt=(T,i,t,o)=>{const a=T[i];return a[Math.max(0,Math.min(a.length-1,Math.round((t-o)/15)))]};
function build(T,F,rem0,o,c,score){const P=S.park,rem=rem0.slice(),out=[];let cur=o,tw=0,warn=0,n=0,mp=0;
 const fill=end=>{for(;;){let b=null;for(const i of rem){const t=cur+(out.length?WK:0),w=wt(T,i,t,o);if(t+w+RD>end)continue;const sc=score(i,w,t);if(!b||sc<b.sc)b={i,t,w,sc}}
  if(!b)break;out.push({s:b.t,e:b.t+b.w+RD,ty:'a',ti:'🎢 '+rides[P][b.i][0],sub:`待ち約${b.w}分（予測）＋乗車${RD}分`});tw+=b.w;n++;if(S.must[K(P,b.i)])mp++;cur=b.t+b.w+RD;rem.splice(rem.indexOf(b.i),1)}};
 for(const b of [...F,{s:c,end:1}]){fill(b.s);if(cur<b.s-5)out.push({s:cur,e:b.s,ty:'f',ti:'フリー・移動・休憩',sub:''});if(b.end)break;if(b.s<cur-5)warn++;out.push(b);cur=Math.max(cur,b.e)}
 return{out,rem,tw,warn,n,mp}}
function plan(){const o=tm(S.open),c=tm(S.close),P=S.park;
 if(!(c>o)||isNaN(Date.parse(S.date))){$('out').innerHTML='<div class="s warn">来園日と開園・閉園時刻を確認してください</div>';$('sum').textContent='';return}
 const F=[],add=(s,d,ty,ti,sub)=>{s=tm(s);if(Number.isFinite(s))F.push({s,e:s+d,ty,ti,sub})};
 S.ev.forEach(x=>x.on&&add(x.s,x.d,x.t==='パレード'?'p':'s',(x.t==='パレード'?'🎉 ':'✨ ')+x.n,'待機込み '+x.d+'分'));
 S.meals.forEach(x=>x.on&&add(x.s,x.d,'m','🍽 '+x.n,x.d+'分'));
 if(S.shop.on)add(S.shop.s,S.shop.d,'sh','🛍 買い物',S.shop.d+'分');
 const rem=[];rides[P].forEach((r,i)=>{const k=K(P,i);if(!S.sel[k])return;if(S.dpa[k])add(S.dpa[k],RD+10,'d','🎫 '+r[0]+'（DPA）','指定時刻に入場');else rem.push(i)});
 F.sort((a,b)=>a.s-b.s);
 const T=table(),av={};rem.forEach(i=>av[i]=T[i].reduce((a,b)=>a+b,0)/T[i].length);
 const mu=i=>S.must[K(P,i)]?.55:1,val=r=>r.mp*5000+r.n*1000-r.tw;
 let best=build(T,F,rem,o,c,(i,w)=>w/av[i]*mu(i));sd=12345;const rnd=()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296;
 for(let k=0;k<300;k++){const r=build(T,F,rem,o,c,(i,w)=>w/av[i]*mu(i)*(1+.8*rnd()));if(val(r)>val(best))best=r}
 const base=build(T,F,rem,o,c,i=>i);PLAN=best.out;
 $('sum').innerHTML=`アトラクション<b>${best.n}</b>個／待ち時間の合計<b>${best.tw}分</b>（予測）<br>選んだ順にそのまま並ぶ場合：${base.n}個／${base.tw}分`+(best.n>=base.n&&best.tw<base.tw?` → <b>約${base.tw-best.tw}分短縮</b>`:'');
 $('out').innerHTML=best.out.map(x=>`<div class="it ${x.ty}"><div class="tm">${fm(x.s)}<br>〜${fm(x.e)}</div><div><b>${esc(x.ti)}</b>${x.sub?`<div class="sub">${x.sub}</div>`:''}</div></div>`).join('')+(best.rem.length?`<div class="s warn">入りきらなかった：${best.rem.map(i=>rides[P][i][0]).join('、')}</div>`:'')+(best.warn?`<div class="s warn">⚠ 予定が重なっています（${best.warn}件）</div>`:'')}
function form(){const P=S.park,ck=v=>v?'checked':'',op=(l,cur)=>l.map(([v,t])=>`<option value="${v}" ${cur===v?'selected':''}>${t}</option>`).join('');
$('form').innerHTML=`<div class="c"><div class="seg"><button data-a="park:land" class="${P==='land'?'on':''}">ランド</button><button data-a="park:sea" class="${P==='sea'?'on':''}">シー</button></div>
<div class="r"><label>来園日</label><input type="date" data-p="date" value="${S.date}"></div>
<div class="r"><label>天気</label><select data-p="weather">${op([['sun','晴れ・くもり'],['rain','雨'],['heavy','強い雨']],S.weather)}</select></div>
<div class="r"><label>時期</label><select data-p="season">${op([['quiet','閑散期'],['normal','通常'],['busy','繁忙期'],['verybusy','超繁忙期']],S.season)}</select></div>
<div class="r"><label>祝日・イベント</label><select data-p="dayType">${op([['auto','通常日'],['holiday','祝日・3連休'],['vacation','学校休暇・大型連休'],['event','特別イベント日']],S.dayType)}</select></div>
<div class="r"><label>開園</label><input type="time" data-p="open" value="${S.open}"><label>閉園</label><input type="time" data-p="close" value="${S.close}"></div></div>
<div class="c"><h2>乗りたいアトラクション</h2><div class="s">左：行く／★：必ず入れたい／右：DPAを取った場合の入場時刻（空欄＝スタンバイ）</div>
${rides[P].map((r,i)=>{const k=K(P,i);return `<div class="r"><input type="checkbox" id="c${i}" data-p="sel.${k}" ${ck(S.sel[k])}><label for="c${i}">${r[0]}</label><label class="st"><input type="checkbox" data-p="must.${k}" ${ck(S.must[k])}>★</label><input type="time" data-p="dpa.${k}" value="${S.dpa[k]||''}"></div>`}).join('')}</div>
<div class="c"><h2>ショー・パレード</h2>${S.ev.map((x,i)=>`<div class="r"><input type="checkbox" data-p="ev.${i}.on" ${ck(x.on)}><select data-p="ev.${i}.t"><option ${x.t==='パレード'?'selected':''}>パレード</option><option ${x.t==='ショー'?'selected':''}>ショー</option></select><input type="text" data-p="ev.${i}.n" value="${esc(x.n)}"><input type="time" data-p="ev.${i}.s" value="${x.s}"><input type="number" data-p="ev.${i}.d" value="${x.d}" min="5" max="180">分<button class="bt" data-a="del:${i}">✕</button></div>`).join('')}<button class="bt" data-a="add">＋追加</button>${sBtn()}</div>
<div class="c"><h2>食事・買い物</h2>${S.meals.map((x,i)=>`<div class="r"><input type="checkbox" data-p="meals.${i}.on" ${ck(x.on)}><label>${esc(x.n)}</label><input type="time" data-p="meals.${i}.s" value="${x.s}"><input type="number" data-p="meals.${i}.d" value="${x.d}" min="5" max="180">分</div>`).join('')}
<div class="r"><input type="checkbox" data-p="shop.on" ${ck(S.shop.on)}><label>買い物</label><input type="time" data-p="shop.s" value="${S.shop.s}"><input type="number" data-p="shop.d" value="${S.shop.d}" min="5" max="180">分</div></div>`}
function setPath(p,v){const a=p.split('.');let o=S;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
document.addEventListener('input',e=>{const t=e.target,p=t.dataset&&t.dataset.p;if(!p)return;setPath(p,t.type==='checkbox'?t.checked:t.type==='number'?Number(t.value):t.value);save();
 if(p==='date'&&!isNaN(Date.parse(t.value))){const ic=inferCtx(new Date(t.value+'T12:00:00'));S.season=ic.season;S.dayType=ic.dayType;form();autoW()}plan()});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const [k,v]=el.dataset.a.split(':');
 if(k==='copy'){const txt=PLAN.map(x=>`${fm(x.s)}-${fm(x.e)} ${x.ti}`).join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert('コピーしました')).catch(()=>alert(txt));return}
 if(k==='imp')impShows();if(k==='park')S.park=v;if(k==='del')S.ev.splice(+v,1);if(k==='add')S.ev.push({t:'ショー',n:'ショー名',s:'18:00',d:40,on:true});save();form();plan()});
$('src').textContent=`予測モデル：端末の実績${loadLocal().length}件を使用`;
form();plan();loadShared(n=>{const pick={land:[0,1,2,4],sea:[0,1,3,4]};for(const pk of ['land','sea']){const L=rides[pk];if(!L.some(r=>r[3]>=100&&S.sel[pk+'|'+r[3]]))L.forEach(r=>{if(r[3]>=100&&pick[pk].includes(r[4]))S.sel[pk+'|'+r[3]]=1})}$('src').textContent=`予測モデル：共有実績${n}件＋端末の実績${loadLocal().length}件を使用（アトラクション${rides.land.length+rides.sea.length}件）`;TBL=null;form();plan()});autoW();
})();
</script></body></html>
