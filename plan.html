function baseCurve(min,idx,openMinute,closeMinute){

const wt=(T,i,t,o)=>{const a=T[i];return a[Math.max(0,Math.min(a.length-1,Math.round((t-o)/15)))]};
function build(T,F,rem0,o,c,score){const P=S.park,rem=rem0.slice(),out=[],pl={};let cur=o,tw=0,warn=0,n=0,sw=0;F.forEach(x=>{if(x.ri!=null)pl[x.ri]=1});
 const fill=end=>{for(;;){let b=null;const l=out[out.length-1],lr=l&&l.ty==='a'?l.ri:-1;for(const i of new Set(rem)){if(i===lr)continue;const t=cur+(out.length?WK:0),w=wt(T,i,t,o);if(t+w+RD>end)continue;const sc=score(i,w,t,pl[i]||0);if(!b||sc<b.sc)b={i,t,w,sc}}
  if(!b)break;const p=+S.pri[K(P,b.i)],q=pl[b.i]||0;out.push({s:b.t,e:b.t+b.w+RD,ty:'a',ri:b.i,ti:'🎢 '+rides[P][b.i][0]+' '+stars(p)+(q?`（${q+1}回目）`:''),sub:`待ち約${b.w}分（予測）＋乗車${RD}分`});tw+=b.w;n++;sw+=PW[p]*(q?.5:1);pl[b.i]=q+1;cur=b.t+b.w+RD;rem.splice(rem.indexOf(b.i),1)}};
 for(const b of [...F,{s:c,end:1}]){fill(b.s);if(cur<b.s-5)out.push({s:cur,e:b.s,ty:'f',ti:'フリー・移動・休憩',sub:''});if(b.end)break;if(b.s<cur-5)warn++;out.push(b);cur=Math.max(cur,b.e)}
 return{out,rem,tw,warn,n,sw}}
function plan(){const o=tm(S.open),c=tm(S.close),P=S.park;
 if(!(c>o)||isNaN(Date.parse(S.date))){$('out').innerHTML='<div class="s warn">来園日と開園・閉園時刻を確認してください</div>';$('sum').textContent='';return}
 const base=[],shows=[],rem=[];
 rides[P].forEach((r,i)=>{const k=K(P,i),p=+S.pri[k]||0;if(!p)return;const d=tm(S.dpa[k]);let nn=Math.max(1,Math.min(4,+S.cnt[k]||1));if(Number.isFinite(d)){nn--;base.push({s:d,e:d+RD+10,ty:'d',ti:'🎫 '+r[0]+'（DPA） '+stars(p),sub:'指定時刻に入場',w:PW[p],ri:i})}for(let j=0;j<nn;j++)rem.push(i)});
 S.ev.forEach(x=>{const s=tm(x.s),p=+x.pri||0;if(p&&Number.isFinite(s))shows.push({s,e:s+x.d,ty:x.t==='パレード'?'p':'s',ti:(x.t==='パレード'?'🎉 ':'✨ ')+x.n+' '+stars(p),sub:'待機込み '+x.d+'分',w:PW[p],p})});
 shows.sort((a,b)=>b.p-a.p);
 const fl=[...S.meals.map(x=>Object.assign({ty:'m',ti:'🍽 '+x.n,w:6000},x)),Object.assign({ty:'sh',ti:'🛍 買い物',w:2000},S.shop)].filter(x=>x.on&&x.d>0).map(x=>Object.assign({},x,{a:tm(x.a),b:tm(x.b)})).filter(x=>x.a<=x.b);
 const T=table(),av={};rem.forEach(i=>av[i]=T[i].reduce((a,b)=>a+b,0)/T[i].length);
 const ov=(x,y)=>x.s<y.e+WK&&y.s<x.e+WK,sq=p=>Math.sqrt(PW[p]/1000);
 sd=12345;const rnd=()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296;
 let best=null,F0=null;
 for(let k=0;k<400;k++){
  const F=base.slice(),cs=[],miss=[];
  for(const s of shows){if(F.some(y=>ov(s,y)))continue;if(k&&rnd()>[0,.35,.7,1][s.p])continue;F.push(s);cs.push(s)}
  for(const m of (k?fl.slice().sort(()=>rnd()-.5):fl)){const cand=[];for(let t=m.a;t<=m.b;t+=15){const x={s:t,e:t+m.d};if(t>=o&&t+m.d<=c&&!F.some(y=>ov(x,y)))cand.push(t)}
   if(!cand.length){miss.push(m);continue}const t=k?cand[Math.floor(rnd()*cand.length)]:cand[Math.floor(cand.length/2)];
   F.push({s:t,e:t+m.d,ty:m.ty,ti:m.ti,sub:`${m.d}分（${fm(m.a)}〜${fm(m.b)}の間で調整）`,w:m.w})}
  F.sort((a,b)=>a.s-b.s);
  const r=build(T,F,rem,o,c,(i,w,t,n)=>w/av[i]/sq(+S.pri[K(P,i)])*(n?2.5:1)*(k?1+.6*rnd():1)),v=r.sw+F.reduce((a,y)=>a+(y.w||0),0)-r.tw;
  if(!k)F0=F;if(!best||v>best.v)best=Object.assign(r,{v,cs,miss,F})}
 const nv=build(T,F0,rem,o,c,i=>i),sh=best.cs.length;PLAN=best.out;
 $('sum').innerHTML=`アトラクション<b>${best.n}</b>個＋DPA${base.length}個／ショー・パレード<b>${sh}</b>本／待ち時間の合計<b>${best.tw}分</b>（予測）<br>選んだ順にそのまま並べた場合：${nv.n}個／${nv.tw}分`;
 const skip=shows.filter(x=>!best.cs.includes(x)).map(x=>x.ti);
 $('out').innerHTML=best.out.map(x=>`<div class="it ${x.ty}"><div class="tm">${fm(x.s)}<br>〜${fm(x.e)}</div><div><b>${esc(x.ti)}</b>${x.sub?`<div class="sub">${x.sub}</div>`:''}</div></div>`).join('')
 +(best.rem.length?`<div class="s warn">入りきらなかったアトラクション：${[...new Set(best.rem)].map(i=>{const q=best.rem.filter(x=>x===i).length;return rides[P][i][0]+' '+stars(+S.pri[K(P,i)])+(q>1?'×'+q:'')}).join('、')}</div>`:'')
 +(skip.length?`<div class="s warn">見られなかったショー・パレード：${skip.map(esc).join('、')}</div>`:'')
 +(best.miss.length?`<div class="s warn">時間帯に入れられなかった：${best.miss.map(m=>esc(m.ti)).join('、')}（時間帯を広げてください）</div>`:'')}
function form(){const P=S.park,ck=v=>v?'checked':'',op=(l,cur)=>l.map(([v,t])=>`<option value="${v}" ${cur===v?'selected':''}>${t}</option>`).join(''),pr=cur=>[[0,'—'],[1,'★'],[2,'★★'],[3,'★★★']].map(([v,t])=>`<option value="${v}" ${(+cur||0)===v?'selected':''}>${t}</option>`).join('');
$('form').innerHTML=`<div class="c"><div class="seg"><button data-a="park:land" class="${P==='land'?'on':''}">ランド</button><button data-a="park:sea" class="${P==='sea'?'on':''}">シー</button></div>
<div class="r"><label>来園日</label><input type="date" data-p="date" value="${S.date}"></div>
<div class="r"><label>天気</label><select data-p="weather">${op([['sun','晴れ・くもり'],['rain','雨'],['heavy','強い雨']],S.weather)}</select></div>
<div class="r"><label>時期</label><select data-p="season">${op([['quiet','閑散期'],['normal','通常'],['busy','繁忙期'],['verybusy','超繁忙期']],S.season)}</select></div>
<div class="r"><label>祝日・イベント</label><select data-p="dayType">${op([['auto','通常日'],['holiday','祝日・3連休'],['vacation','学校休暇・大型連休'],['event','特別イベント日']],S.dayType)}</select></div>
<div class="r"><label>開園</label><input type="time" data-p="open" value="${S.open}"><label>閉園</label><input type="time" data-p="close" value="${S.close}"></div></div>
<div class="c"><h2>乗りたいアトラクション</h2><div class="s">優先度：★★★＝絶対／★★＝行きたい／★＝できれば／—＝行かない。回数は最大で乗りたい回数（2回目以降は優先度を半分として扱います）。右はDPAの入場時刻（空欄＝スタンバイ）</div>
${rides[P].map((r,i)=>{const k=K(P,i);return `<div class="r"><label>${esc(r[0])}</label><select data-p="pri.${k}" data-n="1">${pr(S.pri[k])}</select><select data-p="cnt.${k}" data-n="1">${[1,2,3,4].map(v=>`<option value="${v}" ${(+S.cnt[k]||1)===v?'selected':''}>${v}回</option>`).join('')}</select><input type="time" data-p="dpa.${k}" value="${S.dpa[k]||''}">${S.dpa[k]?`<button class="bt" data-a="cdpa:${k}">✕</button>`:''}</div>`}).join('')}</div>
<div class="c"><h2>ショー・パレード</h2><div class="s">優先度を付けたものの中から、見られる組み合わせを自動で選びます</div>${S.ev.map((x,i)=>`<div class="r"><select data-p="ev.${i}.pri" data-n="1">${pr(x.pri)}</select><select data-p="ev.${i}.t"><option ${x.t==='パレード'?'selected':''}>パレード</option><option ${x.t==='ショー'?'selected':''}>ショー</option></select><input type="text" data-p="ev.${i}.n" value="${esc(x.n)}"><input type="time" data-p="ev.${i}.s" value="${x.s}"><input type="number" data-p="ev.${i}.d" value="${x.d}" min="5" max="180">分<button class="bt" data-a="del:${i}">✕</button></div>`).join('')}<button class="bt" data-a="add">＋追加</button>${sBtn()}</div>
<div class="c"><h2>食事・買い物</h2><div class="s">開始してよい時間帯を入力すると、その範囲で最適な時刻を自動で決めます</div>${S.meals.map((x,i)=>`<div class="r"><input type="checkbox" data-p="meals.${i}.on" ${ck(x.on)}><label>${esc(x.n)}</label><input type="time" data-p="meals.${i}.a" value="${x.a}">〜<input type="time" data-p="meals.${i}.b" value="${x.b}"><input type="number" data-p="meals.${i}.d" value="${x.d}" min="5" max="180">分</div>`).join('')}
<div class="r"><input type="checkbox" data-p="shop.on" ${ck(S.shop.on)}><label>買い物</label><input type="time" data-p="shop.a" value="${S.shop.a}">〜<input type="time" data-p="shop.b" value="${S.shop.b}"><input type="number" data-p="shop.d" value="${S.shop.d}" min="5" max="180">分</div></div>`}
function setPath(p,v){const a=p.split('.');let o=S;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
document.addEventListener('input',e=>{const t=e.target,p=t.dataset&&t.dataset.p;if(!p)return;setPath(p,t.type==='checkbox'?t.checked:(t.type==='number'||t.dataset.n)?Number(t.value):t.value);save();
 if(p==='date'&&!isNaN(Date.parse(t.value))){const ic=inferCtx(new Date(t.value+'T12:00:00'));S.season=ic.season;S.dayType=ic.dayType;form();autoW()}plan()});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const [k,v]=el.dataset.a.split(':');
 if(k==='copy'){const txt=PLAN.map(x=>`${fm(x.s)}-${fm(x.e)} ${x.ti}`).join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert('コピーしました')).catch(()=>alert(txt));return}
 if(k==='cdpa')delete S.dpa[v];if(k==='imp')impShows();if(k==='park')S.park=v;if(k==='del')S.ev.splice(+v,1);if(k==='add')S.ev.push({t:'ショー',n:'ショー名',s:'18:00',d:40,pri:2});save();form();plan()});
$('src').textContent=`予測モデル：端末の実績${loadLocal().length}件を使用`;
form();plan();loadShared((n,ok)=>{const pick={land:[0,1,2,4],sea:[0,1,3,4]};for(const pk of ['land','sea']){const L=rides[pk];if(!L.some(r=>r[3]>=100&&S.pri[pk+'|'+r[3]]))L.forEach(r=>{if(r[3]>=100&&pick[pk].includes(r[4]))S.pri[pk+'|'+r[3]]=2})}$('src').textContent=(ok?'':'⚠ アトラクション一覧（data/rides.json）が見つかりません。')+`予測モデル：共有実績${n}件＋端末の実績${loadLocal().length}件を使用（アトラクション${rides.land.length+rides.sea.length}件）`;TBL=null;form();plan()});autoW();
})();
</script></body></html>
